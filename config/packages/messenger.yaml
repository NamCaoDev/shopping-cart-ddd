framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # Consumed by Ecotone, not by messenger:consume — the transport name must
            # match the channel name used in #[Asynchronous('async_email_queue')].
            async_email_queue:
                dsn: '%env(KAFKA_DSN)%'
                options:
                    # The bundle's consumer always subscribes to the topic named 'events',
                    # so the producer has to publish there too.
                    topicName: 'events'
                    receiveTimeout: 10000
                    commitAsync: true
                    flushRetries: 3
                    flushTimeout: 10000
                    producer:
                        enable.idempotence: 'true'
                    consumer:
                        group.id: 'symfony_ddd_email_worker'
                        auto.offset.reset: 'earliest'
                        enable.auto.commit: 'false'

        routing:
            # Route your messages to the transports
            # 'App\Message\YourMessage': async

